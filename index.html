<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포물선 운동 시뮬레이터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        canvas {
            background-image: 
                linear-gradient(to right, #f0f0f0 1px, transparent 1px),
                linear-gradient(to bottom, #f0f0f0 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .data-row-interval { background-color: #f9fafb; font-style: italic; }
        .accel-cell { color: #ef4444; font-weight: bold; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { opacity: 1; }
        .table-container { max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
        <div class="p-6 bg-indigo-600">
            <h1 class="text-2xl font-bold text-white text-center">포물선 운동 시뮬레이터 (물리 정밀 검증 v2)</h1>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 p-6">
            <!-- 설정 패널 -->
            <div class="lg:col-span-1 space-y-5 bg-gray-50 p-4 rounded-lg border border-gray-200">
                <h2 class="font-bold text-gray-700 border-b pb-2">시뮬레이션 설정</h2>
                
                <div class="space-y-1">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-medium text-gray-600">발사 각도 (°)</label>
                        <input type="number" id="angleNum" min="0" max="90" value="45" step="1" class="w-16 border rounded px-1 py-1 text-sm text-indigo-600 font-bold text-right">
                    </div>
                    <input type="range" id="angleSlide" min="0" max="90" value="45" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                </div>

                <div class="space-y-1">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-medium text-gray-600">초기 속력 (m/s)</label>
                        <input type="number" id="speedNum" min="0" max="30" step="0.1" value="15" class="w-16 border rounded px-1 py-1 text-sm text-indigo-600 font-bold text-right">
                    </div>
                    <input type="range" id="speedSlide" min="0" max="30" step="0.1" value="15" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                </div>

                <div class="space-y-1">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-medium text-gray-600">초기 높이 (m)</label>
                        <input type="number" id="initialYNum" min="0" max="10" step="0.1" value="0" class="w-16 border rounded px-1 py-1 text-sm text-indigo-600 font-bold text-right">
                    </div>
                    <input type="range" id="initialYSlide" min="0" max="10" step="0.1" value="0" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                </div>

                <div class="space-y-1">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-medium text-gray-600">x축 가속도 (m/s²)</label>
                        <input type="number" id="accelXNum" min="-10" max="10" step="0.1" value="0" class="w-16 border rounded px-1 py-1 text-sm text-red-500 font-bold text-right">
                    </div>
                    <input type="range" id="accelXSlide" min="-10" max="10" step="0.1" value="0" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-red-500">
                </div>

                <div class="space-y-1">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-medium text-gray-600">y축 가속도 (m/s²)</label>
                        <input type="number" id="accelYNum" min="-20" max="10" step="0.1" value="-9.8" class="w-16 border rounded px-1 py-1 text-sm text-red-500 font-bold text-right">
                    </div>
                    <input type="range" id="accelYSlide" min="-20" max="10" step="0.1" value="-9.8" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-red-500">
                </div>

                <div class="pt-2 space-y-3">
                    <button id="startBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition-all shadow-md active:scale-95">
                        운동 시작
                    </button>
                    <button id="resetBtn" class="w-full bg-gray-300 hover:bg-gray-400 text-gray-700 font-bold py-2 px-4 rounded-lg transition-colors">
                        초기화
                    </button>
                </div>
            </div>

            <!-- 메인 시뮬레이션 및 데이터 영역 -->
            <div class="lg:col-span-3 space-y-6">
                <!-- 결과 요약 패널 -->
                <div class="grid grid-cols-3 gap-4">
                    <div class="bg-indigo-50 p-4 rounded-lg border border-indigo-100 shadow-sm text-center">
                        <div class="text-xs text-indigo-600 font-bold uppercase mb-1">최종 운동 시간</div>
                        <div class="text-xl font-black text-indigo-900" id="resTime">0.000 <span class="text-sm font-normal">s</span></div>
                    </div>
                    <div class="bg-emerald-50 p-4 rounded-lg border border-emerald-100 shadow-sm text-center">
                        <div class="text-xs text-emerald-600 font-bold uppercase mb-1">최고점 높이</div>
                        <div class="text-xl font-black text-emerald-900" id="resMaxY">0.000 <span class="text-sm font-normal">m</span></div>
                    </div>
                    <div class="bg-amber-50 p-4 rounded-lg border border-amber-100 shadow-sm text-center">
                        <div class="text-xs text-amber-600 font-bold uppercase mb-1">수평 도달 거리</div>
                        <div class="text-xl font-black text-amber-900" id="resRange">0.000 <span class="text-sm font-normal">m</span></div>
                    </div>
                </div>

                <div class="relative bg-white border border-gray-300 rounded-lg overflow-hidden shadow-inner h-[350px]">
                    <canvas id="simCanvas" class="w-full h-full"></canvas>
                    <div class="absolute bottom-2 left-2 text-xs text-gray-400 bg-white/80 px-1 rounded">Scale: 1 box = 40px (1m)</div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- X축 데이터 표 -->
                    <div class="border rounded-lg shadow-sm bg-white overflow-hidden">
                        <div class="bg-blue-600 px-4 py-2 font-bold text-white text-sm">X축 성분 데이터 (Horizontal)</div>
                        <div class="table-container" id="containerX">
                            <table class="min-w-full divide-y divide-gray-200 text-xs" id="tableX">
                                <thead class="bg-gray-50 sticky top-0 z-10">
                                    <tr>
                                        <th class="px-2 py-2 text-left font-semibold text-gray-600">시간(s)</th>
                                        <th class="px-2 py-2 text-left font-semibold text-gray-600">위치(x)</th>
                                        <th class="px-2 py-2 text-left font-semibold text-gray-600">구간거리($\Delta x$)</th>
                                        <th class="px-2 py-2 text-left font-semibold text-gray-600">구간속도($\bar{v}_x$)</th>
                                        <th class="px-2 py-2 text-left font-semibold text-gray-600">가속도</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100" id="bodyX"></tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Y축 데이터 표 -->
                    <div class="border rounded-lg shadow-sm bg-white overflow-hidden">
                        <div class="bg-rose-600 px-4 py-2 font-bold text-white text-sm">Y축 성분 데이터 (Vertical)</div>
                        <div class="table-container" id="containerY">
                            <table class="min-w-full divide-y divide-gray-200 text-xs" id="tableY">
                                <thead class="bg-gray-50 sticky top-0 z-10">
                                    <tr>
                                        <th class="px-2 py-2 text-left font-semibold text-gray-600">시간(s)</th>
                                        <th class="px-2 py-2 text-left font-semibold text-gray-600">위치(y)</th>
                                        <th class="px-2 py-2 text-left font-semibold text-gray-600">구간거리($\Delta y$)</th>
                                        <th class="px-2 py-2 text-left font-semibold text-gray-600">구간속도($\bar{v}_y$)</th>
                                        <th class="px-2 py-2 text-left font-semibold text-gray-600">가속도</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100" id="bodyY"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const bodyX = document.getElementById('bodyX');
        const bodyY = document.getElementById('bodyY');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');

        const resTime = document.getElementById('resTime');
        const resMaxY = document.getElementById('resMaxY');
        const resRange = document.getElementById('resRange');

        const inputs = [
            { slide: 'angleSlide', num: 'angleNum' },
            { slide: 'speedSlide', num: 'speedNum' },
            { slide: 'initialYSlide', num: 'initialYNum' },
            { slide: 'accelXSlide', num: 'accelXNum' },
            { slide: 'accelYSlide', num: 'accelYNum' }
        ];

        inputs.forEach(pair => {
            const slideEl = document.getElementById(pair.slide);
            const numEl = document.getElementById(pair.num);
            slideEl.addEventListener('input', () => { numEl.value = slideEl.value; onInputUpdate(); });
            numEl.addEventListener('input', () => { 
                let val = parseFloat(numEl.value);
                if (!isNaN(val)) { slideEl.value = val; onInputUpdate(); }
            });
        });

        let animationId = null;
        const PPCM = 40; 
        const RECORD_DT = 0.1; 
        const DRAW_DT = 0.01; 

        function onInputUpdate() { if (!animationId) drawInitialState(); }

        function initCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            drawInitialState();
        }

        function drawAxes() {
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 2);
            ctx.lineTo(canvas.width, canvas.height - 2);
            ctx.stroke();
        }

        function drawInitialState() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawAxes();
            const y0 = parseFloat(document.getElementById('initialYNum').value);
            const cy = canvas.height - (y0 * PPCM);
            ctx.beginPath();
            ctx.arc(15, cy, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#4338ca';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();

        function calcPos(t, v0x, v0y, y0, ax, ay) {
            return {
                x: v0x * t + 0.5 * ax * t * t,
                y: y0 + v0y * t + 0.5 * ay * t * t
            };
        }

        function startSimulation() {
            if (animationId) cancelAnimationFrame(animationId);
            
            bodyX.innerHTML = '';
            bodyY.innerHTML = '';
            
            const angleRad = (parseFloat(document.getElementById('angleNum').value) * Math.PI) / 180;
            const v0 = parseFloat(document.getElementById('speedNum').value);
            const y0 = parseFloat(document.getElementById('initialYNum').value);
            const ax = parseFloat(document.getElementById('accelXNum').value);
            const ay = parseFloat(document.getElementById('accelYNum').value);

            const v0x = v0 * Math.cos(angleRad);
            const v0y = v0 * Math.sin(angleRad);

            let t = 0;
            let lastRecordT = 0;
            let trajectory = [];
            let maxObservedY = y0;
            
            // 초기 포인트 기록
            const startPos = calcPos(0, v0x, v0y, y0, ax, ay);
            addPointRow(bodyX, 0, startPos.x);
            addPointRow(bodyY, 0, startPos.y);
            
            let lastX = startPos.x;
            let lastY = startPos.y;

            function animate() {
                const pos = calcPos(t, v0x, v0y, y0, ax, ay);
                const x = pos.x;
                const y = pos.y;

                if (y < 0 && t > 0.01) {
                    let tFinal = t;
                    if (Math.abs(ay) > 0.001) {
                        const det = v0y * v0y - 2 * ay * (y0 - 0); // y = 0 인 지점
                        tFinal = (-v0y - Math.sqrt(det)) / ay;
                    } else if (Math.abs(v0y) > 0.001) {
                        tFinal = -y0 / v0y;
                    }
                    
                    const finalPos = calcPos(tFinal, v0x, v0y, y0, ax, ay);
                    resTime.innerHTML = `${tFinal.toFixed(3)} <span class="text-sm font-normal">s</span>`;
                    resRange.innerHTML = `${Math.max(0, finalPos.x).toFixed(3)} <span class="text-sm font-normal">m</span>`;
                    
                    cancelAnimationFrame(animationId);
                    animationId = null;
                    return;
                }

                if (y > maxObservedY) maxObservedY = y;
                resMaxY.innerHTML = `${maxObservedY.toFixed(3)} <span class="text-sm font-normal">m</span>`;
                resRange.innerHTML = `${Math.max(0, x).toFixed(3)} <span class="text-sm font-normal">m</span>`;
                resTime.innerHTML = `${t.toFixed(3)} <span class="text-sm font-normal">s</span>`;

                const cx = x * PPCM + 15;
                const cy = canvas.height - (y * PPCM);

                if (cx > canvas.width + 500 || t > 60) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                    return;
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawAxes();

                trajectory.push({cx, cy});
                ctx.beginPath();
                ctx.setLineDash([2, 4]);
                ctx.strokeStyle = '#6366f1';
                ctx.lineWidth = 2;
                if (trajectory.length > 0) {
                    ctx.moveTo(trajectory[0].cx, trajectory[0].cy);
                    for (let p of trajectory) ctx.lineTo(p.cx, p.cy);
                }
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.beginPath();
                ctx.arc(cx, cy, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#4338ca';
                ctx.fill();
                ctx.stroke();

                // 0.1초 데이터 기록 고정 루프
                if (t >= lastRecordT + RECORD_DT) {
                    const currentT = Math.round((lastRecordT + RECORD_DT) * 10) / 10;
                    const currentPos = calcPos(currentT, v0x, v0y, y0, ax, ay);
                    
                    // X축 계산
                    const deltaX = currentPos.x - lastX;
                    const avgVx = deltaX / RECORD_DT;
                    addIntervalRow(bodyX, lastRecordT.toFixed(1), currentT.toFixed(1), deltaX, avgVx, ax);
                    addPointRow(bodyX, currentT, currentPos.x);

                    // Y축 계산 (물리적으로 변위 / 시간은 (v_start + v_end)/2와 같아야 함)
                    const deltaY = currentPos.y - lastY;
                    const avgVy = deltaY / RECORD_DT;
                    addIntervalRow(bodyY, lastRecordT.toFixed(1), currentT.toFixed(1), deltaY, avgVy, ay);
                    addPointRow(bodyY, currentT, currentPos.y);
                    
                    lastRecordT = currentT;
                    lastX = currentPos.x;
                    lastY = currentPos.y;
                    scrollTables();
                }

                t += DRAW_DT;
                animationId = requestAnimationFrame(animate);
            }
            animate();
        }

        function addPointRow(targetBody, t, pos) {
            const row = document.createElement('tr');
            row.className = "bg-white font-medium";
            row.innerHTML = `
                <td class="px-2 py-1 text-indigo-700 font-bold">${t.toFixed(1)}s</td>
                <td class="px-2 py-1 text-gray-900">${pos.toFixed(4)}m</td>
                <td class="px-2 py-1 text-gray-300">-</td>
                <td class="px-2 py-1 text-gray-300">-</td>
                <td class="px-2 py-1 text-gray-300">-</td>
            `;
            targetBody.appendChild(row);
        }

        function addIntervalRow(targetBody, tStart, tEnd, dist, speed, accel) {
            const row = document.createElement('tr');
            row.className = "data-row-interval text-gray-500";
            row.innerHTML = `
                <td class="px-2 py-0.5 text-[10px] text-gray-400">구간(${tStart}~${tEnd})</td>
                <td class="px-2 py-0.5">-</td>
                <td class="px-2 py-0.5 text-blue-500 font-medium">${dist.toFixed(4)}</td>
                <td class="px-2 py-0.5 text-green-600 font-medium">${speed.toFixed(4)}</td>
                <td class="px-2 py-0.5 accel-cell">${accel.toFixed(1)}</td>
            `;
            targetBody.appendChild(row);
        }

        function scrollTables() {
            document.getElementById('containerX').scrollTop = document.getElementById('containerX').scrollHeight;
            document.getElementById('containerY').scrollTop = document.getElementById('containerY').scrollHeight;
        }

        function reset() {
            if (animationId) cancelAnimationFrame(animationId);
            animationId = null;
            bodyX.innerHTML = '';
            bodyY.innerHTML = '';
            resTime.innerHTML = `0.000 <span class="text-sm font-normal">s</span>`;
            resMaxY.innerHTML = `0.000 <span class="text-sm font-normal">m</span>`;
            resRange.innerHTML = `0.000 <span class="text-sm font-normal">m</span>`;
            initCanvas();
        }

        startBtn.addEventListener('click', startSimulation);
        resetBtn.addEventListener('click', reset);
    </script>
</body>
</html>
